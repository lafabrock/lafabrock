<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La fabrock — Show archive</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff5a36'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://lafabrock.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a href="#/home" class="brand" aria-label="La fabrock archive home">
      <svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/>
        <circle cx="20" cy="20" r="11" stroke="currentColor" stroke-width="1" opacity=".45"/>
        <circle cx="20" cy="20" r="4.5" fill="var(--accent)"/>
        <path d="M20 2v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-text"><strong>La fabrock</strong><span>Show archive</span></span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/home" data-tab="home">Home</a>
      <a href="#/seasons" data-tab="seasons">Seasons</a>
      <a href="#/songs" data-tab="songs">Songs</a>
      <a href="#/shows" data-tab="shows">Shows</a>
      <a href="#/artists" data-tab="artists">Artists</a>
    </nav>
    <button class="localbtn" id="localbtn" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Local files</span></button>
    <button class="theme" id="theme" aria-label="Toggle light and dark mode" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite">
  <div class="loading"><span class="dot"></span> Loading the archive…</div>
</main>

<footer class="wrap foot" id="foot"></footer>
<div class="player" id="player" hidden></div>

<script src="app.js"></script>
</body>
</html>
