name: Update archive and deploy

on:
  schedule:
    - cron: '0 9 * * 6'   # every Saturday 09:00 UTC
  workflow_dispatch: {}   # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild data/shows.json from Mixcloud
        run: python3 tools/update_data.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "fabrock-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update show archive $(date -u +%F) [skip ci]"
          git push
