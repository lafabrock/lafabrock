name: Update archive and deploy

on:
  schedule:
    - cron: '0 9 * * 6'   # every Saturday 09:00 UTC
  workflow_dispatch: {}   # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # stops here (and GitHub e-mails you) if Mixcloud answered badly:
      # tracklists lost, shows missing… The published data is left untouched.
      - name: Rebuild data/shows.json from Mixcloud
        run: python3 tools/update_data.py

      - name: Build the public pages (one page per show, sitemap, share tags)
        run: python3 tools/build_pages.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "fabrock-bot"
          git config user.email "actions@github.com"
          git add data/ show/ sitemap.xml index.html
          git diff --cached --quiet || git commit -m "chore: update show archive $(date -u +%F) [skip ci]"
          git push
