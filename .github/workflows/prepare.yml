name: Préparer un brouillon Instagram/Facebook

# Prépare (ou refait) le brouillon d'un épisode précis dans social/<épisode>/, sans rien publier.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Épisode (ex. s14e05)"
        required: true

permissions:
  contents: write

concurrency:
  group: archive-commits
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter > /dev/null || echo "Inter indisponible, police de secours"

      - name: Prepare the draft
        env:
          EPISODE: ${{ inputs.episode }}
        run: python3 tools/social.py prepare "$EPISODE"

      - name: Commit the draft
        run: |
          git config user.name "fabrock-bot"
          git config user.email "actions@github.com"
          git add social/
          git diff --cached --quiet && exit 0
          git commit -m "chore: social draft ${{ inputs.episode }} [skip ci]"
          git pull --rebase -q && git push
